name: Build, verify and deploy to the VPS

# Reusable workflow behind on_merge_dev.yml and on_merge_main.yml. Both
# environments run exactly the same two phases — verify, then deploy — and
# differ only in the branch, the environment tag and the hostname, so the
# script lives here once rather than being copy-pasted per branch.
#
# Phase 1 (verify) runs on the GitHub runner: lint, build the Vite app, and
# import the Flask app. A merge that cannot build is caught before anything
# touches the VPS, which matters because the deploy tears the running stack
# down before it rebuilds.
#
# Phase 2 (deploy) SSHes to the box, fast-forwards the checkout, and rebuilds
# the compose stack. The images are built *on the VPS* rather than pushed from
# CI: docker/caddy/Dockerfile already runs `npm ci && npm run build` in a node
# stage, so the box needs nothing installed but Docker itself.
#
# ---------------------------------------------------------------------------
# Single-host architecture
# ---------------------------------------------------------------------------
# dev and prod share one VPS. Everything that could collide is namespaced by
# environment — the checkout directory, the compose project, the built image
# tags, the deploy env file — and each stack publishes on its own *loopback*
# port, so neither is reachable from the internet directly:
#
#   VPS
#   └─ edge caddy :80/:443            docker/edge/, deployed from /opt/fretbook-edge
#      ├─ PROD_DOMAIN → 127.0.0.1:8081   project fretbook-prod, /opt/fretbook-prod
#      └─ DEV_DOMAIN  → 127.0.0.1:8082   project fretbook-dev,  /opt/fretbook-dev
#
# The edge proxy is the single public entrypoint and the only thing that holds
# a public port or terminates TLS. Every deploy re-applies it (idempotently),
# which is why both callers must share one concurrency group: two runs bringing
# the edge up at once would race on the same container.
#
# ---------------------------------------------------------------------------
# Dependencies
# ---------------------------------------------------------------------------
# Repository variables — Settings > Secrets and variables > Actions > Variables:
#   VPS_IP        Public IPv4 of the one VPS. Required.
#   PROD_DOMAIN   Hostname the edge serves production on. Required.
#   DEV_DOMAIN    Hostname the edge serves dev on. Required.
#   ACME_EMAIL    Contact address Let's Encrypt uses for expiry notices.
#
# Both domains are needed on every run, including a dev-only deploy, because
# the edge Caddyfile describes the whole box: writing it with one hostname
# missing would take the other environment offline.
#
# Repository secrets — same page, Secrets tab:
#   SSH_PASSWORD       Password of the VPS's SSH user. sshd must permit
#                      password auth, and the user must keep passwordless
#                      sudo — the non-interactive script below cannot answer
#                      a sudo prompt.
#
# Nothing is needed to read the code: the repo is public, so the VPS clones it
# anonymously.
#
# Because the repo is public, the callers must stay on `push` triggers. A
# `pull_request` trigger would let anyone's fork PR run this, and while GitHub
# withholds secrets from fork PRs — so SSH_PASSWORD would be empty and the
# deploy would simply fail — the safe way to get PR feedback is to trigger the
# `verify` job on pull_request and leave `deploy` on push only.
#
# These are read straight from the `vars`/`secrets` contexts rather than passed
# in as inputs, because they describe the host and are identical for every
# caller. The callers pass only what actually differs per environment, and
# `secrets: inherit` — a reusable workflow gets no secrets otherwise.
#
# Preexisting infrastructure — assumed, not created here:
#   - A VPS at VPS_IP running Ubuntu, reachable on port 22 with password auth,
#     with ports 80 and 443 open to the internet.
#   - A records for PROD_DOMAIN and DEV_DOMAIN pointing at VPS_IP. These are
#     not created here, and certificate issuance (HTTP-01) fails without them.
#   - Docker is installed by the deploy step when missing; nothing else is.

on:
  workflow_call:
    inputs:
      env_name:
        description: Short environment tag; must be dev or prod.
        required: true
        type: string
      branch:
        description: Branch to deploy.
        required: true
        type: string
      site_domain:
        description: Hostname this environment is served on.
        required: true
        type: string
      ssh_user:
        description: SSH login user; must have passwordless sudo.
        required: false
        type: string
        default: ubuntu

permissions:
  contents: read

env:
  # The loopback ports the two stacks publish on, and the single place they are
  # defined: the deploy picks its own out of this pair and writes both into the
  # edge proxy's env file, so the proxy and the stacks cannot drift apart.
  PROD_PORT: "8081"
  DEV_PORT: "8082"

jobs:
  # Cheap gate in front of the deploy. Everything here is also done inside the
  # Docker build, but doing it on the runner first means a broken commit fails
  # in ~1 min without having stopped the running stack on the VPS.
  verify:
    runs-on: ubuntu-latest
    steps:
      - name: Check out the repo
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          # Matches the build stage in docker/caddy/Dockerfile, so a version
          # difference cannot let CI pass while the image build fails.
          node-version: "22"
          cache: npm

      - name: Install dependencies
        # ci, not install: the lockfile is the input, and a silent dependency
        # bump is not something a deploy should discover on its own.
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Build the frontend
        run: npm run build

      - name: Confirm the build produced an entrypoint
        # Caddy serves dist/ as the site root; an empty dist is a 404 on the
        # apex rather than a build failure, so check for the file explicitly.
        run: test -f dist/index.html

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          # Matches the backend image (python:3.12-slim).
          python-version: "3.12"

      - name: Install backend dependencies
        run: pip install -r docker/backend/requirements.txt

      - name: Import the Flask app
        # gunicorn only imports wsgi:app at startup, so a broken import or a
        # blueprint clash would otherwise surface as a crash-looping container
        # on the VPS instead of a failed check here.
        working-directory: docker/backend
        run: python -c "from wsgi import app; print(sorted(r.rule for r in app.url_map.iter_rules()))"

  deploy:
    needs: verify
    runs-on: ubuntu-latest
    steps:
      # The SSH action fails opaquely on an empty host, and a missing domain
      # would write an edge config that silently drops an environment, so check
      # the whole set up front with messages that say where to set them.
      - name: Require the host configuration
        env:
          VPS_IP: ${{ vars.VPS_IP }}
          PROD_DOMAIN: ${{ vars.PROD_DOMAIN }}
          DEV_DOMAIN: ${{ vars.DEV_DOMAIN }}
          ACME_EMAIL: ${{ vars.ACME_EMAIL }}
          SITE_DOMAIN: ${{ inputs.site_domain }}
          ENV_NAME: ${{ inputs.env_name }}
        run: |
          set -euo pipefail

          missing=""
          [ -n "${VPS_IP}" ]      || missing="${missing} VPS_IP"
          [ -n "${PROD_DOMAIN}" ] || missing="${missing} PROD_DOMAIN"
          [ -n "${DEV_DOMAIN}" ]  || missing="${missing} DEV_DOMAIN"
          [ -n "${ACME_EMAIL}" ]  || missing="${missing} ACME_EMAIL"
          if [ -n "${missing}" ]; then
            echo "::error::Missing repository variables:${missing}. Set them under Settings > Secrets and variables > Actions > Variables."
            exit 1
          fi

          # The caller passes this environment's hostname, and the edge config
          # below is written from the two variables above; if they disagree,
          # the deploy would route to a hostname the proxy does not serve.
          if [ "${SITE_DOMAIN}" != "${PROD_DOMAIN}" ] && [ "${SITE_DOMAIN}" != "${DEV_DOMAIN}" ]; then
            echo "::error::site_domain (${SITE_DOMAIN}) matches neither PROD_DOMAIN nor DEV_DOMAIN."
            exit 1
          fi

          echo "Deploying ${ENV_NAME} to ${VPS_IP} as ${SITE_DOMAIN}."

      - name: SSH in, clone if needed, rebuild and run
        uses: appleboy/ssh-action@v1.0.3
        env:
          REPO_FULL: ${{ github.repository }}
          ENV_NAME: ${{ inputs.env_name }}
          BRANCH: ${{ inputs.branch }}
          SITE_DOMAIN: ${{ inputs.site_domain }}
          PROD_DOMAIN: ${{ vars.PROD_DOMAIN }}
          DEV_DOMAIN: ${{ vars.DEV_DOMAIN }}
          ACME_EMAIL: ${{ vars.ACME_EMAIL }}
          PROD_PORT: ${{ env.PROD_PORT }}
          DEV_PORT: ${{ env.DEV_PORT }}
        with:
          host: ${{ vars.VPS_IP }}
          username: ${{ inputs.ssh_user }}
          # Password auth rather than a key: Ubuntu cloud images disable root
          # login, and this box is reached as an unprivileged user.
          password: ${{ secrets.SSH_PASSWORD }}
          port: 22
          # Give the remote shell a generous budget: a cold box installs Docker
          # and builds both images from scratch on the first run.
          command_timeout: 30m
          envs: REPO_FULL,ENV_NAME,BRANCH,SITE_DOMAIN,PROD_DOMAIN,DEV_DOMAIN,ACME_EMAIL,PROD_PORT,DEV_PORT
          script: |
            set -euo pipefail

            # This environment's loopback port. Both are known here because the
            # edge config written further down describes the whole box.
            case "${ENV_NAME}" in
              prod) WEB_PORT="${PROD_PORT}" ;;
              dev)  WEB_PORT="${DEV_PORT}" ;;
              *)
                echo "Unknown environment '${ENV_NAME}'; expected dev or prod." >&2
                exit 1
                ;;
            esac

            # --- Confirm sudo works without a password ----------------------
            # This session has no TTY, so a sudo that wants a password would
            # hang until the job times out rather than fail. -n turns that into
            # an immediate error with an actionable message.
            if ! sudo -n true 2>/dev/null; then
              echo "sudo requires a password for $(id -un); the deploy cannot escalate." >&2
              echo "Restore passwordless sudo for this user (see /etc/sudoers.d/)." >&2
              exit 1
            fi

            # --- Ensure Docker is installed ---------------------------------
            # The VPS may be a bare box; install Docker + the compose plugin
            # from Docker's apt repo if they aren't already present. Running
            # unprivileged, so every step here goes through sudo.
            if ! command -v docker >/dev/null 2>&1; then
              echo "Docker not found; installing…"
              export DEBIAN_FRONTEND=noninteractive
              sudo -E apt-get update -y
              sudo -E apt-get install -y ca-certificates curl gnupg
              sudo install -m 0755 -d /etc/apt/keyrings
              curl -fsSL https://download.docker.com/linux/ubuntu/gpg \
                | sudo gpg --batch --yes --dearmor -o /etc/apt/keyrings/docker.gpg
              sudo chmod a+r /etc/apt/keyrings/docker.gpg
              echo "deb [arch=$(dpkg --print-architecture) signed-by=/etc/apt/keyrings/docker.gpg] https://download.docker.com/linux/ubuntu $(. /etc/os-release && echo "$VERSION_CODENAME") stable" \
                | sudo tee /etc/apt/sources.list.d/docker.list >/dev/null
              sudo -E apt-get update -y
              sudo -E apt-get install -y docker-ce docker-ce-cli containerd.io docker-buildx-plugin docker-compose-plugin
              sudo systemctl enable --now docker
            fi
            sudo docker --version
            sudo docker compose version

            # --- Clone the repo if it isn't already on the VPS --------------
            # Suffixed with the environment: dev and prod share this box, and
            # each needs its own checkout at its own commit. /opt is
            # root-owned, so create the directory owned by the login user — git
            # then runs unprivileged, and mixed-ownership repos also trip git's
            # safe.directory check.
            APP_DIR="/opt/fretbook-${ENV_NAME}"
            sudo install -d -o "$(id -un)" -g "$(id -gn)" "${APP_DIR}"

            # Anonymous HTTPS clone; the repo is public, so no credential is
            # involved on the box at any point.
            CLONE_URL="https://github.com/${REPO_FULL}.git"

            if [ -d "${APP_DIR}/.git" ]; then
              # Already cloned: hard-reset to the tip of the branch so the merge
              # that triggered this run is what actually gets deployed, and any
              # hand-editing done on the box is discarded rather than merged.
              echo "Repo already present at ${APP_DIR}; updating to origin/${BRANCH}."
              cd "${APP_DIR}"
              git remote set-url origin "${CLONE_URL}"
              git fetch --no-tags origin "${BRANCH}"
              git reset --hard "origin/${BRANCH}"
              git clean -fd
            else
              echo "Cloning ${REPO_FULL} (${BRANCH}) into ${APP_DIR}."
              git clone --branch "${BRANCH}" "${CLONE_URL}" "${APP_DIR}"
              cd "${APP_DIR}"
            fi
            echo "Deploying $(git rev-parse --short HEAD)."

            # --- Compose's environment --------------------------------------
            # docker-compose.yml interpolates WEB_PORT and IMAGE_TAG out of the
            # environment compose itself runs in. Compose runs under sudo here,
            # and sudo's env_reset scrubs the variables this script was given,
            # so they would never reach it — compose would silently fall back
            # to the file's defaults (port 8080, tag "local"), and both
            # environments would then fight over the same port on this shared
            # box. Write them to an env file compose reads directly, which sudo
            # cannot strip.
            #
            # Kept outside APP_DIR so the checkout never holds deploy config,
            # and root-owned 600 to match the file this would hold secrets in
            # once the backend grows any.
            ENV_FILE="/opt/fretbook-${ENV_NAME}-deploy.env"
            sudo install -m 600 /dev/null "${ENV_FILE}"
            sudo tee "${ENV_FILE}" >/dev/null <<EOF
            WEB_PORT=${WEB_PORT}
            IMAGE_TAG=${ENV_NAME}
            EOF

            # --- Rebuild and run this environment's stack -------------------
            # The compose file's build contexts are relative to its own
            # directory, so passing it by absolute path works unchanged.
            #
            # --project-name namespaces containers, networks and volumes, which
            # is what lets both environments coexist on this host.
            COMPOSE_FILE="${APP_DIR}/docker/docker-compose.yml"
            PROJECT="fretbook-${ENV_NAME}"
            compose() {
              sudo docker compose --env-file "${ENV_FILE}" -f "${COMPOSE_FILE}" -p "${PROJECT}" "$@"
            }

            # Clean rebuild + restart on every deploy: tear the old stack down
            # first, then rebuild the images from the freshly pulled source and
            # force-recreate the containers so nothing stale survives. Only
            # this environment's project is touched; the other one keeps
            # serving throughout.
            compose down --remove-orphans || true
            compose up --build -d --force-recreate

            # --- Confirm the stack actually came up -------------------------
            # The backend deliberately publishes no host port, so there is
            # nothing to curl from the VPS. Read the healthcheck compose already
            # defines instead — it runs inside the container, against the port
            # gunicorn actually listens on.
            echo "Waiting for backend health (up to ~4 min)…"
            backend_cid="$(compose ps -q backend)"
            ok=0
            for _ in $(seq 1 120); do
              status="$(sudo docker inspect -f '{{.State.Health.Status}}' "${backend_cid}" 2>/dev/null || echo missing)"
              if [ "${status}" = "healthy" ]; then
                ok=1
                break
              fi
              # A container that exited will never become healthy; stop early
              # rather than burning the full four minutes on a crash loop.
              if [ "${status}" = "missing" ]; then
                break
              fi
              sleep 2
            done

            if [ "${ok}" -ne 1 ]; then
              echo "Backend did not become healthy. Recent container logs:"
              compose logs --tail 60 || true
              exit 1
            fi

            # Probe this stack's own Caddy directly on its loopback port, before
            # the edge is involved, so a routing failure below is unambiguously
            # the proxy's rather than the app's.
            code="$(curl -s -o /dev/null -w '%{http_code}' "http://127.0.0.1:${WEB_PORT}/api/health" || echo 000)"
            if [ "${code}" != "200" ]; then
              echo "Backend is healthy but its Caddy did not serve /api/health (HTTP ${code}). Caddy logs:"
              compose logs --tail 60 web || true
              exit 1
            fi
            # The SPA itself is served from the same site block; a 200 here
            # means the node build stage actually produced dist/.
            root_code="$(curl -s -o /dev/null -w '%{http_code}' "http://127.0.0.1:${WEB_PORT}/" || echo 000)"
            if [ "${root_code}" != "200" ]; then
              echo "API is up but the site root returned HTTP ${root_code}; the frontend build may be empty. Caddy logs:"
              compose logs --tail 60 web || true
              exit 1
            fi
            echo "${ENV_NAME} stack is serving on 127.0.0.1:${WEB_PORT}."

            # --- Apply the edge proxy ---------------------------------------
            # Run from a fixed directory rather than from this environment's
            # checkout: the Caddyfile is bind-mounted by path, so alternating
            # deploys would otherwise recreate the container on every run and
            # drop connections. Copying from the checkout means the edge config
            # is still versioned with the app and updates when it changes.
            EDGE_DIR="/opt/fretbook-edge"
            sudo install -d -o "$(id -un)" -g "$(id -gn)" "${EDGE_DIR}"
            cp "${APP_DIR}/docker/edge/docker-compose.yml" "${APP_DIR}/docker/edge/Caddyfile" "${EDGE_DIR}/"

            EDGE_ENV="/opt/fretbook-edge.env"
            sudo install -m 600 /dev/null "${EDGE_ENV}"
            sudo tee "${EDGE_ENV}" >/dev/null <<EOF
            PROD_DOMAIN=${PROD_DOMAIN}
            DEV_DOMAIN=${DEV_DOMAIN}
            ACME_EMAIL=${ACME_EMAIL}
            PROD_PORT=${PROD_PORT}
            DEV_PORT=${DEV_PORT}
            EOF

            edge() {
              sudo docker compose --env-file "${EDGE_ENV}" -f "${EDGE_DIR}/docker-compose.yml" -p fretbook-edge "$@"
            }
            # No --force-recreate: this runs on every deploy of either
            # environment, and the proxy should only restart when its config
            # actually changed. Compose is already idempotent about that, and a
            # needless restart here would interrupt the *other* environment too.
            edge up -d

            # --- Confirm the edge routes this environment -------------------
            # Loopback with the real Host header: matching the site block is
            # what is being tested, so Caddy's redirect to HTTPS (308) is a
            # pass. Following it would mean waiting on certificate issuance,
            # which is asynchronous on a first deploy and would make this check
            # flaky rather than useful.
            echo "Waiting for the edge to route ${SITE_DOMAIN}…"
            edge_ok=0
            for _ in $(seq 1 30); do
              edge_code="$(curl -s -o /dev/null -w '%{http_code}' -H "Host: ${SITE_DOMAIN}" http://127.0.0.1/api/health || echo 000)"
              case "${edge_code}" in
                2*|3*) edge_ok=1; break ;;
              esac
              sleep 2
            done

            if [ "${edge_ok}" -ne 1 ]; then
              echo "The stack is up but the edge did not route ${SITE_DOMAIN} (HTTP ${edge_code}). Edge logs:"
              edge logs --tail 60 || true
              exit 1
            fi

            # --- Reclaim disk -----------------------------------------------
            # Two environments rebuilding both images on one box fills a small
            # VPS disk quickly. Dangling images only — the layer cache and the
            # images either stack is actually running are left alone.
            sudo docker image prune -f >/dev/null || true

            echo "Deploy succeeded; ${SITE_DOMAIN} is served from the ${ENV_NAME} stack."
