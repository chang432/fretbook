name: Deploy dev

# Owns merges to the dev branch. All of the work lives in deploy.yml; this file
# exists to bind the dev branch to the dev environment's variables and secrets.
#
# Repository variables — Settings > Secrets and variables > Actions > Variables:
#   DEV_VPS_IP     Public IPv4 of the dev VPS. Required.
#   DEV_WEB_PORT   Host port Caddy is published on. Optional; defaults to 80.
#
# Repository secrets — same page, Secrets tab:
#   DEV_SSH_PASSWORD   Password of the dev VPS's "ubuntu" user. Required.
#   GH_PAT_REPO_READ   Read-access PAT for the clone on the VPS. Only needed
#                      while this repo is private.

on:
  push:
    branches: [ "dev" ]
  workflow_dispatch:

permissions:
  contents: read

# Deploys stop the running stack before rebuilding it, so two overlapping runs
# would leave the box in whichever state finished last. Queue them instead; an
# in-flight deploy is allowed to finish rather than being cancelled halfway.
concurrency:
  group: deploy-dev
  cancel-in-progress: false

jobs:
  deploy:
    uses: ./.github/workflows/deploy.yml
    with:
      env_name: dev
      branch: dev
      vps_ip: ${{ vars.DEV_VPS_IP }}
      web_port: ${{ vars.DEV_WEB_PORT || '80' }}
    secrets:
      ssh_password: ${{ secrets.DEV_SSH_PASSWORD }}
      gh_pat_repo_read: ${{ secrets.GH_PAT_REPO_READ }}
