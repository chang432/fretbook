name: Deploy dev

# Owns merges to the dev branch. All of the work lives in deploy.yml; this file
# exists to bind the dev branch to the dev environment's identity.
#
# The host itself (VPS_IP, both domains, ACME_EMAIL, SSH_PASSWORD) is shared
# with production and read straight from the repository variables and secrets
# by deploy.yml — see that file's header for the full list.

on:
  push:
    branches: [ "dev" ]
  workflow_dispatch:

permissions:
  contents: read

# Deliberately the same group as on_merge_main.yml: dev and prod share one VPS,
# and every deploy re-applies the shared edge proxy, so two runs at once would
# race on the same container. Queueing them costs a few minutes; an in-flight
# deploy is allowed to finish rather than being cancelled halfway.
concurrency:
  group: deploy-vps
  cancel-in-progress: false

jobs:
  deploy:
    uses: ./.github/workflows/deploy.yml
    with:
      env_name: dev
      branch: dev
      site_domain: ${{ vars.DEV_DOMAIN }}
    # A reusable workflow receives no secrets unless they are handed to it.
    secrets: inherit
