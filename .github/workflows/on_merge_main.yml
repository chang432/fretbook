name: Deploy production

# Owns merges to main. Identical in shape to on_merge_dev.yml — same reusable
# workflow, same phases, same box — pointed at the production hostname and
# checkout instead.
#
# The host itself (VPS_IP, both domains, ACME_EMAIL, SSH_PASSWORD) is shared
# with dev and read straight from the repository variables and secrets by
# deploy.yml — see that file's header for the full list.
#
# To gate production behind a manual approval, create an Environment named
# "production" under Settings > Environments with a required reviewer, then add
# `environment: production` to the job below. Nothing else has to change.

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

permissions:
  contents: read

# Shared with on_merge_dev.yml on purpose; see the note there.
concurrency:
  group: deploy-vps
  cancel-in-progress: false

jobs:
  deploy:
    uses: ./.github/workflows/deploy.yml
    with:
      env_name: prod
      branch: main
      site_domain: ${{ vars.PROD_DOMAIN }}
    secrets: inherit
