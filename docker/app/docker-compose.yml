# Two containers: caddy serves the built Vite app and reverse-proxies /api to
# gunicorn/Flask. Run from this directory: `docker compose up --build`.
#
# IMAGE_TAG namespaces the images this builds. It defaults to "local" so a
# laptop is unaffected; CI sets it per environment (see
# .github/workflows/deploy.yml) so a dev and a prod stack sharing one host
# cannot overwrite each other's images.

services:
  backend:
    build:
      context: ./backend
    image: fretbook-backend:${IMAGE_TAG:-local}
    restart: unless-stopped
    environment:
      PORT: "8000"
      WEB_CONCURRENCY: "2"
      LOG_LEVEL: info
    # Not published on the host — only caddy needs to reach it.
    expose:
      - "8000"
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/api/health').read()"
      interval: 30s
      timeout: 3s
      retries: 3
      start_period: 5s

  web:
    build:
      # Repo root, so the frontend build stage can see package.json and src/.
      # Two levels up from docker/app/, and the Dockerfile is named relative to
      # that root rather than to this file.
      context: ../..
      dockerfile: docker/app/caddy/Dockerfile
    image: fretbook-web:${IMAGE_TAG:-local}
    restart: unless-stopped
    ports:
      # Loopback only. On the VPS the edge proxy (docker/edge/) is the one
      # thing holding a public port and reaches this over 127.0.0.1; binding
      # 0.0.0.0 here would publish the stack alongside it, unencrypted and
      # on a port number. Locally this is still http://localhost:8080.
      - "127.0.0.1:${WEB_PORT:-8080}:80"
    depends_on:
      backend:
        condition: service_healthy
