# Two containers: caddy serves the built Vite app and reverse-proxies /api to
# gunicorn/Flask, which is also where the published notes come from — the
# bucket is private, so the backend reads it over the S3 API and the browser
# never touches R2. Run from this directory: `docker compose up --build`.
#
# The backend's four notes variables come from a git-ignored .env beside this
# file locally, and from /opt/fretbook-<env>-deploy.env on the VPS. Without
# them the stack still runs: /api/notes answers 503 and /notes shows an empty
# shelf.
#
# IMAGE_TAG namespaces the images this builds. It defaults to "local" so a
# laptop is unaffected; CI sets it per environment (see
# .github/workflows/deploy.yml) so a dev and a prod stack sharing one host
# cannot overwrite each other's images.

services:
  backend:
    build:
      context: ./backend
    image: fretbook-backend:${IMAGE_TAG:-local}
    restart: unless-stopped
    environment:
      PORT: "8000"
      WEB_CONCURRENCY: "2"
      LOG_LEVEL: info
      # Every print and gunicorn log line is written here inside the container
      # as well as to the container's streams, so a debug print can be read
      # back with `docker compose exec backend cat /var/log/output.log` after
      # it has scrolled past. Empty leaves the streams as the only place.
      LOG_FILE: /var/log/output.log
      # The private notes bucket this environment serves, and the credentials
      # for it. Runtime settings rather than build args, which is what lets one
      # web image serve both environments: the bundle asks its own origin, and
      # this is the end that knows which bucket that means.
      #
      # The token here should be Object Read only — this process never writes.
      # Publishing is a laptop with a different token; see
      # docs/notes-via-s3-client.md. boto3 reads the AWS_* pair itself.
      FRETBOOK_NOTES_BUCKET: ${FRETBOOK_NOTES_BUCKET:-}
      FRETBOOK_R2_ENDPOINT: ${FRETBOOK_R2_ENDPOINT:-}
      AWS_ACCESS_KEY_ID: ${AWS_ACCESS_KEY_ID:-}
      AWS_SECRET_ACCESS_KEY: ${AWS_SECRET_ACCESS_KEY:-}
    # Not published on the host — only caddy needs to reach it.
    expose:
      - "8000"
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/api/health').read()"
      interval: 30s
      timeout: 3s
      retries: 3
      start_period: 5s

  web:
    build:
      # Repo root, so the frontend build stage can see package.json and src/.
      # Two levels up from docker/app/, and the Dockerfile is named relative to
      # that root rather than to this file.
      context: ../..
      dockerfile: docker/app/caddy/Dockerfile
    image: fretbook-web:${IMAGE_TAG:-local}
    restart: unless-stopped
    ports:
      # Loopback only. On the VPS the edge proxy (docker/edge/) is the one
      # thing holding a public port and reaches this over 127.0.0.1; binding
      # 0.0.0.0 here would publish the stack alongside it, unencrypted and
      # on a port number. Locally this is still http://localhost:8080.
      - "127.0.0.1:${WEB_PORT:-8080}:80"
    depends_on:
      backend:
        condition: service_healthy
